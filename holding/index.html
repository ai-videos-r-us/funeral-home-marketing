<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Funeral Director Awards</title>
<meta name="description" content="A directory of funeral directors in South West England, with independent annual awards. Launching soon.">
<style>
  :root { --midnight:#101D30; --champagne:#C5AD78; --ivory:#F5F2EA; --soft:#C9CED6; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--midnight); color:var(--ivory); font-family:"Montserrat","Helvetica Neue",Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; text-align:center; }
  main { max-width:640px; }
  .mark { font-weight:800; font-size:clamp(2rem,7vw,3.4rem); line-height:1.05; letter-spacing:.01em; margin:0; }
  .awards { display:block; color:var(--champagne); font-weight:600; letter-spacing:.42em; font-size:clamp(1rem,3.5vw,1.6rem); margin:.5rem 0 0 .42em; }
  .rule { width:72px; height:2px; background:var(--champagne); margin:2rem auto; border:0; }
  p { font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--soft); font-size:1.15rem; line-height:1.6; margin:0 0 1rem; }
  .small { font-size:.9rem; margin-top:2.5rem; }
</style>
</head>
<body>
<main>
  <h1 class="mark">Funeral Director<span class="awards">AWARDS</span></h1>
  <hr class="rule">
  <p>A directory of every funeral director in South West England, with sourced details and independent annual awards.</p>
  <p>Launching soon.</p>
  <p class="small">Published by Next Chapter Media, a trading name of AI Video Systems.</p>
</main>
</body>
</html>
